name: Teste de fumaça (k6)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Subir o ServeRest local
        run: |
          npm install -g serverest
          nohup serverest --port 3000 --nodoc > serverest.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/produtos > /dev/null; then
              echo "ServeRest respondendo"
              exit 0
            fi
            sleep 2
          done
          echo "ServeRest não subiu a tempo"; cat serverest.log; exit 1

      - name: Instalar o k6
        uses: grafana/setup-k6-action@v1

      # O k6 grava os relatórios do handleSummary, mas não cria o diretório.
      - name: Garantir a pasta de relatórios
        run: mkdir -p relatorios

      - name: Executar o teste de fumaça
        id: testes
        continue-on-error: true
        run: k6 run scripts/smoke.js
        env:
          BASE_URL: http://localhost:3000

      - name: Publicar os relatórios como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-k6
          path: relatorios/
          if-no-files-found: ignore

      - name: Publicar o relatório no GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: relatorios

      - name: Refletir o resultado do teste
        if: steps.testes.outcome == 'failure'
        run: |
          echo "Algum limite de aceitação foi estourado. Veja o relatório publicado."
          exit 1
